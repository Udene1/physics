name: Vita CI

on:
  push:
    branches: [main, 'typescript-*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vita
          POSTGRES_PASSWORD: vita
          POSTGRES_DB: vita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vita -d vita_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vita:vita@localhost:5432/vita_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:migrate
      - run: npm run db:check
      - run: npm run build
      - run: npm test
